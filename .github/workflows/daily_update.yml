name: Daily OilChem Price Update

on:
  schedule:
    # Runs at 11:30 Spanish time (09:30 UTC in Summer CEST / 10:30 UTC in Winter CET)
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl requests

    - name: Create Session Cookies File
      run: |
        echo '${{ secrets.OILCHEM_COOKIES }}' > "session_cookies.json"

    - name: Run Downloader
      run: |
        python "oilchem_downloader.py"

    - name: Run Data Preprocessing
      run: |
        python "data_preprocessing.py"

    - name: Run Lead-Lag Analysis
      run: |
        python "lead_lag_analysis.py"

    - name: Upload outputs to Neon Database via API
      env:
        PRICING_INTEL_UPLOAD_API_URL: ${{ secrets.PRICING_INTEL_UPLOAD_API_URL }}
        PRICING_INTEL_API_KEY: ${{ secrets.PRICING_INTEL_API_KEY }}
      run: |
        python "upload_outputs.py"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "oilchem_all_data.csv" "oilchem_aligned_prices.csv" "oilchem_aligned_prices.xlsx" "oilchem_lead_lag_results.csv" data/*.csv
        git diff-index --quiet HEAD || (git commit -m "Automated daily price update and alignment" && git push)

    - name: Generate Pricing Report and Send Email
      continue-on-error: true
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
      run: |
        python "oilchem_daily_report.py" --recipient "j.veiga@daxxgrp.com"



